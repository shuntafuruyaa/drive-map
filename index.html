function fitTrip(id) {
  const t = DB.trips[id]; if (!t) return;
  const pts = t.stops.map((x) => DB.spots[x]).filter(Boolean).map((s) => [s.lat, s.lng]);
  if (!pts.length) { toast('この思い出にはまだピンがありません'); return; }
  if (!t.showRoute) { t.showRoute = true; t.updatedAt = Date.now(); markChanged('trips', t.id); renderRoutes(); renderMemories(); }
  renderMarkers(t.stops);
  if (isMobile()) setSheet('min');
  if (pts.length === 1) map.setView(pts[0], 13); else map.fitBounds(L.latLngBounds(pts), { padding: [60, 60], maxZoom: 14 });
}

/* ---------- 軌跡（ルート線） ---------- */
const roadPending = new Set();
const sigOf = (pts) => pts.map((p) => p[0].toFixed(5) + ',' + p[1].toFixed(5)).join(';');
function renderRoutes() {
  if (!routeLayer) return;
  routeLayer.clearLayers();
  for (const t of tripsArr()) {
    if (!t.showRoute) continue;
    const pts = t.stops.map((id) => DB.spots[id]).filter(Boolean).map((s) => [s.lat, s.lng]);
    if (!pts.length) continue;
    const sig = sigOf(pts);
    let line = pts, road = false;
    if (t.useRoad && pts.length >= 2) {
      if (t.road && t.road.sig === sig) { line = t.road.coords; road = true; }
      else fetchRoad(t, pts, sig);
    }
    if (line.length >= 2) {
      L.polyline(line, { color: '#fff', weight: 8, opacity: 0.95, lineJoin: 'round', interactive: false }).addTo(routeLayer);
      L.polyline(line, { color: t.color, weight: 4, opacity: 1, lineJoin: 'round', lineCap: t.dash ? 'butt' : 'round', dashArray: t.dash ? '12 8' : null })
        .bindTooltip(esc(t.title), { sticky: true }).addTo(routeLayer);
      if (!road) for (let i = 1; i < pts.length; i++) {
        const a = map.project(pts[i - 1], 10), b = map.project(pts[i], 10);
        if (a.distanceTo(b) < 3) continue;
        const ang = Math.atan2(b.y - a.y, b.x - a.x) * 180 / Math.PI;
        const mid = map.unproject(a.add(b).divideBy(2), 10);
        L.marker(mid, { interactive: false, keyboard: false, icon: L.divIcon({ className: 'route-arrow', html: `<span style="--c:${t.color};transform:rotate(${ang}deg)"></span>`, iconSize: [12, 12], iconAnchor: [6, 6] }) }).addTo(routeLayer);
      }
    }
    pts.forEach((p, i) => {
      L.marker(p, { interactive: false, keyboard: false, zIndexOffset: 1000, icon: L.divIcon({ className: 'route-num', html: `<span style="background:${t.color}">${i + 1}</span>`, iconSize: [22, 22], iconAnchor: [31, 64] }) }).addTo(routeLayer);
    });
  }
}
async function fetchRoad(t, pts, sig) {
  if (roadPending.has(t.id)) return;
  if (pts.length > 40) { toast('地点が多すぎるため直線で表示しています（40地点まで）'); return; }
  roadPending.add(t.id);
  try {
    const coords = pts.map((p) => `${p[1].toFixed(5)},${p[0].toFixed(5)}`).join(';');
    const j = await fetchJSON(`https://router.project-osrm.org/route/v1/driving/${coords}?overview=full&geometries=geojson`, 20000);
    if (j.code !== 'Ok' || !j.routes || !j.routes[0]) throw new Error('no route');
    const cur = DB.trips[t.id];
    if (cur) { cur.road = { sig, coords: j.routes[0].geometry.coordinates.map((c) => [+c[1].toFixed(5), +c[0].toFixed(5)]), km: j.routes[0].distance / 1000 }; persistSoon(); renderRoutes(); renderMemories(); }
  } catch (e) {
    toast('道路に沿ったルートを取得できなかったので、直線で表示しています', 3800);
  } finally { roadPending.delete(t.id); }
}

/* ---------- 軌跡の編集 ---------- */
function openTripEditor(id) {
  const isNew = !id;
  const t = isNew ? normalizeTrip({ id: uid(), title: '', color: TRIP_COLORS[tripsArr().length % 3], dash: tripsArr().length % 6 >= 3, showRoute: true }) : normalizeTrip(JSON.parse(JSON.stringify(DB.trips[id])));
  if (isNew) t.title = '';

      <div class="f-row"><label class="f"><span>開始日</span><input type="date" data-e-ds value="${t.dateStart}"></label><label class="f"><span>終了日</span><input type="date" data-e-de value="${t.dateEnd}"></label></div>
      <div class="f"><span>線のスタイル</span><div class="linestyles" data-e-colors>${TRIP_COLORS.flatMap((c) => [false, true].map((d) => `<button type="button" data-c="${c}" data-dash="${d ? 1 : 0}" class="${c === t.color && d === t.dash ? 'on' : ''}" aria-label="線のスタイル"><svg viewBox="0 0 60 10" width="60" height="10"><line x1="2" y1="5" x2="58" y2="5" stroke="${c}" stroke-width="4" ${d ? 'stroke-dasharray="9 6"' : 'stroke-linecap="round"'}/></svg></button>`)).join('')}</div></div>
      <div class="f"><span>回った順番</span><ol class="stop-list" data-e-stops style="--c:${t.color}"></ol>

        <button type="button" class="btn sm" data-e="pick" style="margin-top:6px;align-self:flex-start">地図のピンを順番にタップして追加</button></div>
      <label class="check" style="margin-bottom:6px"><input type="checkbox" data-e-show ${t.showRoute ? 'checked' : ''}> 地図に軌跡を表示する</label>
      <label class="check"><input type="checkbox" data-e-road ${t.useRoad ? 'checked' : ''}> 道路に沿った線で表示する（OSRMでルート計算）</label>
      <p class="help">オフにすると、ピン同士を直線で結びます。</p>`,
  });
  const B = m.body;
  const renderStops = () => {
    $('[data-e-stops]', B).style.setProperty('--c', t.color);
    $('[data-e-stops]', B).innerHTML = t.stops.map((sid, i) => { const s = DB.spots[sid]; return s ? `<li><span>${esc(s.name)}<small class="st-mini">${s.status === 'visited' ? '行った' : '行きたい'}</small></span><button type="button" data-up="${i}" aria-label="上へ">↑</button><button type="button" data-down="${i}" aria-label="下へ">↓</button><button type="button" data-rm="${i}" aria-label="外す">✕</button></li>` : ''; }).join('') || '<p class="help" style="margin:0 0 6px">まだ地点がありません。下から追加してください。</p>';
    const opts = spotsArr().sort((a, b) => (a.status === b.status ? a.name.localeCompare(b.name, 'ja') : a.status === 'visited' ? -1 : 1));
    $('[data-e-add]', B).innerHTML = opts.length ? opts.map((s) => `<option value="${s.id}">${esc(s.name)}${s.status === 'visited' ? '（行った）' : '（行きたい）'}</option>`).join('') : '<option value="">スポットがありません</option>';
  };
  renderStops();
  B.addEventListener('click', (e) => {
    const t2 = e.target;
    const c = t2.closest('[data-c]'); if (c) { t.color = c.dataset.c; t.dash = c.dataset.dash === '1'; $$('[data-e-colors] button', B).forEach((b) => b.classList.toggle('on', b === c)); renderStops(); return; }
    const up = t2.closest('[data-up]'); if (up) { const i = +up.dataset.up; if (i > 0) [t.stops[i - 1], t.stops[i]] = [t.stops[i], t.stops[i - 1]]; renderStops(); return; }
    const dn = t2.closest('[data-down]'); if (dn) { const i = +dn.dataset.down; if (i < t.stops.length - 1) [t.stops[i + 1], t.stops[i]] = [t.stops[i], t.stops[i + 1]]; renderStops(); return; }

    }
  });
  m.foot.addEventListener('click', async (e) => {
    const b = e.target.closest('[data-e]'); if (!b) return;

      t.dateStart = $('[data-e-ds]', B).value; t.dateEnd = $('[data-e-de]', B).value;
      t.showRoute = $('[data-e-show]', B).checked; t.useRoad = $('[data-e-road]', B).checked;
      if (!t.useRoad) t.road = null;
      if (!isNew) {
        // 手動で順番を変えたら、旅程テキスト側の対応も保つ（items は残す）
        t.road = t.road && DB.trips[t.id] && DB.trips[t.id].road ? DB.trips[t.id].road : t.road;
      }
      t.updatedAt = Date.now();
      DB.trips[t.id] = normalizeTrip(t); markChanged('trips', t.id);

/* =========================================================
   アプリ化（PWA）・オフライン地図
   ========================================================= */
const PWA = {
  reg: null, deferred: null, waiting: null,
  canSW: () => 'serviceWorker' in navigator && /^https?:$/.test(location.protocol) && window.isSecureContext,
  standalone: () => window.matchMedia('(display-mode: standalone)').matches || navigator.standalone === true,
  isIOS: () => /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1),
  async init() {
    window.addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); this.deferred = e; this.renderUi(); });
    window.addEventListener('appinstalled', () => { this.deferred = null; toast('ホーム画面に追加しました'); this.renderUi(); });
    const net = () => { $('#netbar').hidden = navigator.onLine; };
    window.addEventListener('online', () => { net(); toast('オンラインに戻りました'); });
    window.addEventListener('offline', net); net();
    $('#btnUpdate').addEventListener('click', () => { if (this.waiting) this.waiting.postMessage('skip-waiting'); $('#updbar').hidden = true; });
    $('#btnUpdLater').addEventListener('click', () => { $('#updbar').hidden = true; });
    if (!this.canSW()) return;
    try {
      this.reg = await navigator.serviceWorker.register('sw.js', { scope: './' });
      const showWaiting = (w) => { this.waiting = w; $('#updbar').hidden = false; };
      if (this.reg.waiting && navigator.serviceWorker.controller) showWaiting(this.reg.waiting);

/* ---------- 地図タイルの事前保存 ---------- */
const Offline = {
  AREA: 'dm-area-v1', TILES: 'dm-tiles-v1', LIMIT: 2500, busy: null,
  ok: () => PWA.canSW() && 'caches' in window,
  layerKey() { return LAYERS[settings.layer] && LAYERS[settings.layer].gsi ? settings.layer : 'gsi_std'; },
  tileXY(lat, lng, z) {
    const n = 2 ** z, r = lat * Math.PI / 180;
    return [Math.floor((lng + 180) / 360 * n), Math.floor((1 - Math.log(Math.tan(r) + 1 / Math.cos(r)) / Math.PI) / 2 * n)];
  },
  urlsFor(b, z0, z1, key) {
    const tpl = LAYERS[key].url, out = [];
    for (let z = z0; z <= z1; z++) {
      const [x0, y0] = this.tileXY(b.north, b.west, z), [x1, y1] = this.tileXY(b.south, b.east, z);
      const n = 2 ** z;
      for (let x = Math.max(0, x0); x <= Math.min(n - 1, x1); x++) for (let y = Math.max(0, y0); y <= Math.min(n - 1, y1); y++) out.push(tpl.replace('{z}', z).replace('{x}', x).replace('{y}', y));
    }
    return out;
  },
  viewPlan(depth) {
    const bb = map.getBounds(), z = Math.max(5, map.getZoom());
    const b = { north: bb.getNorth(), south: bb.getSouth(), west: bb.getWest(), east: bb.getEast() };
    const key = this.layerKey();
    return { key, urls: this.urlsFor(b, Math.max(5, z - 1), Math.min(17, z + depth), key) };
  },
  pinsPlan(which) {
    const key = this.layerKey(), set = new Set();
    const list = spotsArr().filter((s) => which === 'all' || s.status === 'want');
    for (const s of list) {
      const b = { north: s.lat + 0.012, south: s.lat - 0.012, west: s.lng - 0.015, east: s.lng + 0.015 };
      for (const u of this.urlsFor(b, 11, 16, key)) set.add(u);
    }
    // ピン全体を見渡せる広域図も少し
    if (list.length) {
      const lats = list.map((s) => s.lat), lngs = list.map((s) => s.lng);
      const b = { north: Math.max(...lats) + 0.2, south: Math.min(...lats) - 0.2, west: Math.min(...lngs) - 0.2, east: Math.max(...lngs) + 0.2 };
      for (const u of this.urlsFor(b, 5, 9, key)) set.add(u);
    }
    return { key, urls: [...set], n: list.length };
  },
  async run(plan, label) {
    if (!this.ok()) { toast('Web公開したURLで開くと地図を保存できます'); return; }
    if (!navigator.onLine) { toast('オフライン中は地図を保存できません'); return; }
    if (!plan.urls.length) { toast('保存する地図がありません'); return; }
    if (plan.urls.length > this.LIMIT) { toast(`範囲が広すぎます（${plan.urls.length}枚）。もう少しズームしてから保存してください（上限${this.LIMIT}枚）`, 5000); return; }
    if (this.busy) { toast('保存中です'); return; }
    const ctl = { stop: false }; this.busy = ctl;
    const cache = await caches.open(this.AREA);
    let done = 0, fail = 0, i = 0;
    const prog = () => this.renderProgress(label, done, plan.urls.length, fail);
    prog();
    const worker = async () => {
      while (!ctl.stop && i < plan.urls.length) {
        const u = plan.urls[i++];
        try {
          if (!(await cache.match(u))) {
            const r = await fetch(u, { mode: 'cors', credentials: 'omit' });
            if (r.ok) await cache.put(u, r); else fail++;
          }
        } catch (e) { fail++; }
        done++; if (done % 10 === 0 || done === plan.urls.length) prog();
      }
    };
    await Promise.all(Array.from({ length: 4 }, worker));
    this.busy = null;
    const areas = settings.offlineAreas || [];
    if (!ctl.stop) {
      areas.unshift({ label, n: plan.urls.length - fail, at: Date.now(), layer: LAYERS[plan.key].name });
      settings.offlineAreas = areas.slice(0, 20); persistSoon();
    }
    toast(ctl.stop ? `中止しました（${done}枚まで保存）` : fail ? `保存しました（${plan.urls.length - fail}枚・失敗${fail}枚）` : `地図を保存しました（${plan.urls.length}枚）`, 3800);
    this.renderUi();
  },
  renderProgress(label, done, total, fail) {
    const el = $('#pane-share [data-off-prog]'); if (!el) return;
    el.innerHTML = `<div class="help">${esc(label)}を保存中… ${done}/${total}枚${fail ? `（失敗${fail}）` : ''}</div><div class="meter"><i style="width:${Math.round(done / total * 100)}%"></i></div><button class="btn sm danger" data-act="off-stop">中止</button>`;
  },
  async usage() {
    let tiles = 0;
    try { for (const n of [this.AREA, this.TILES]) tiles += (await (await caches.open(n)).keys()).length; } catch (e) { /* ignore */ }
    let est = null; try { est = navigator.storage && navigator.storage.estimate ? await navigator.storage.estimate() : null; } catch (e) { /* ignore */ }
    return { tiles, used: est ? est.usage : 0, quota: est ? est.quota : 0 };
  },
  async renderUi() {
    const box = $('#pane-share [data-off]'); if (!box) return;
    if (!this.ok()) { box.innerHTML = '<p class="note" style="margin:0">Web公開したURLで開くと、圏外でも地図を見られるように保存できます。</p>'; return; }
    const u = await this.usage();
    const mb = (b) => (b / 1048576).toFixed(b > 104857600 ? 0 : 1);
    const want = spotsArr().filter((s) => s.status === 'want').length;
    const areas = settings.offlineAreas || [];
    box.innerHTML = `<p class="note">一度表示した地図は自動で保存されます。山や峠など圏外になりそうな場所は、出発前にまとめて保存しておくと安心です。</p>
      <div class="f-inline"><span>くわしさ</span><select data-off-depth>
        <option value="1">ふつう（今のズーム＋1段）</option><option value="2" selected>くわしく（＋2段）</option><option value="3">とてもくわしく（＋3段・範囲は狭めに）</option></select></div>
      <div class="btn-row" style="flex-direction:column">
        <button class="btn primary" data-act="off-view">今見ている範囲を保存</button>
        <button class="btn" data-act="off-pins" ${want ? '' : 'disabled'}>行きたいピン${want}件の周辺を保存</button>
      </div>
      <p class="help" data-off-est></p>
      <div data-off-prog></div>
      <div class="stat" style="margin-top:10px"><div><b>${u.tiles.toLocaleString()}</b>保存済みの地図（枚）</div><div><b>${mb(u.used)}<small style="font-size:12px"> MB</small></b>この端末で使用中</div></div>
      ${areas.length ? `<details><summary>保存した範囲（${areas.length}）</summary><ul style="margin:4px 0;padding-left:18px;font-size:12.5px">${areas.map((a) => `<li>${esc(a.label)}：${a.n}枚（${new Date(a.at).toLocaleDateString('ja-JP')}・${esc(a.layer)}）</li>`).join('')}</ul></details>` : ''}
      <button class="btn danger block" data-act="off-clear" style="margin-top:8px">保存した地図を削除</button>
      ${settings.layer === 'osm' ? '<p class="help">※ OpenStreetMapは利用規約でまとめての保存が禁止されているため、国土地理院地図を保存します（OSMは見た範囲だけ自動保存）。</p>' : ''}`;
    this.updateEstimate();
  },
  updateEstimate() {
    const el = $('#pane-share [data-off-est]'); if (!el || !map) return;
    const d = +($('#pane-share [data-off-depth]') || { value: 2 }).value;
    const p = this.viewPlan(d);
    el.textContent = `今の範囲：約${p.urls.length.toLocaleString()}枚・約${Math.max(1, Math.round(p.urls.length * 0.02))}MB${p.urls.length > this.LIMIT ? '（広すぎるので、もう少しズームしてください）' : ''}`;
  },
  async clear() {
    if (!(await askConfirm('保存した地図をすべて削除しますか？\n（ピンや思い出のデータは消えません）', { ok: '削除する', danger: true }))) return;
    try { await caches.delete(this.AREA); await caches.delete(this.TILES); } catch (e) { /* ignore */ }
    settings.offlineAreas = []; persistSoon(); toast('保存した地図を削除しました'); this.renderUi();
  },
};

/* =========================================================
   共有（URL・引き継ぎコード・ファイル）とリアルタイム同期
   ========================================================= */
function b64urlFromBytes(bytes) {
  let bin = '';
  for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  return btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}
function bytesFromB64url(s) {
  s = s.replace(/-/g, '+').replace(/_/g, '/'); while (s.length % 4) s += '=';
  const bin = atob(s); const out = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
  return out;
}
async function packData(obj) {
  const bytes = new TextEncoder().encode(JSON.stringify(obj));
  if (window.CompressionStream) {
    try {
      const st = new Blob([bytes]).stream().pipeThrough(new CompressionStream('deflate-raw'));
      return 'z' + b64urlFromBytes(new Uint8Array(await new Response(st).arrayBuffer()));
    } catch (e) { /* fallthrough */ }
  }
  return 'j' + b64urlFromBytes(bytes);
}
async function unpackData(str) {
  str = String(str).trim();
  const hi = str.indexOf('#share='); if (hi >= 0) str = str.slice(hi + 7);
  str = str.replace(/^DMAP1[.:]/, '').replace(/\s+/g, '');
  const kind = str[0], body = str.slice(1);
  let bytes = bytesFromB64url(body);
  if (kind === 'z') {
    if (!window.DecompressionStream) throw new Error('このブラウザは圧縮データの展開に対応していません');
    const st = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
    bytes = new Uint8Array(await new Response(st).arrayBuffer());
  } else if (kind !== 'j') throw new Error('形式が違います');
  return JSON.parse(new TextDecoder().decode(bytes));
}
function buildPayload({ photos = true, view = true } = {}) {
  const spots = spotsArr().map((s) => (photos ? s : { ...s, photos: s.photos.filter((p) => !p.src.startsWith('data:')) }));
  const trips = tripsArr().map((t) => { const c = { ...t }; delete c.road; if (!photos) delete c.rawText; return c; });
  return { app: 'drivemap', v: 1, at: Date.now(), spots, trips, view: view ? { ...currentView(), layer: settings.layer, filters } : null };
}
function validPayload(p) { return p && p.app === 'drivemap' && Array.isArray(p.spots); }
const baseUrl = () => location.href.split('#')[0];
const isFile = () => location.protocol === 'file:';

/* ---------- 取り込み ---------- */
function mergeData(spots, trips, mode) {
  if (mode === 'replace') {
    for (const id of Object.keys(DB.spots)) DB.tomb[id] = Date.now();
    for (const id of Object.keys(DB.trips)) DB.tomb[id] = Date.now();
    DB.spots = {}; DB.trips = {};
  }
  let add = 0, upd = 0;
  for (const s0 of spots) {
    const s = normalizeSpot(s0); const l = DB.spots[s.id];
    if (!l) { DB.spots[s.id] = s; add++; delete DB.tomb[s.id]; Room.queue('spots', s.id); }
    else if (s.updatedAt > l.updatedAt) { DB.spots[s.id] = s; upd++; Room.queue('spots', s.id); }
  }
  for (const t0 of trips || []) {
    const t = normalizeTrip(t0); const l = DB.trips[t.id];
    if (!l) { DB.trips[t.id] = t; add++; delete DB.tomb[t.id]; Room.queue('trips', t.id); }
    else if (t.updatedAt > l.updatedAt) { t.road = l.road; DB.trips[t.id] = t; upd++; Room.queue('trips', t.id); }
  }
  if (mode === 'replace') for (const id of Object.keys(DB.tomb)) if (DB.spots[id] || DB.trips[id]) delete DB.tomb[id];
  return { add, upd };
}
function applyView(v) {
  if (!v) return;
  if (v.filters) { filters = { ...filters, ...v.filters }; }
  if (v.layer && LAYERS[v.layer]) { setLayer(v.layer, true); renderLayerMenu(); }
  if (v.c && v.z) map.setView(v.c, v.z);
}
function openImportDialog(p, source) {
  const ns = p.spots.length, nt = (p.trips || []).length;
  const when = p.at ? `（${new Date(p.at).toLocaleString('ja-JP', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' })} 時点）` : '';
  const mine = spotsArr().length;
  const m = openModal({
    title: source === 'url' ? '共有マップを受け取りました' : 'データを読み込む', cls: 'sm',
    html: `<p style="margin:0 0 12px">スポット <b>${ns}</b>件・思い出 <b>${nt}</b>件のデータです${when}。</p>
      <div class="btn-row" style="flex-direction:column">
        ${source === 'url' ? '<button class="btn primary" data-i="view">まず見るだけ（保存しない）</button>' : ''}
        <button class="btn ${source === 'url' ? '' : 'primary'}" data-i="merge">自分のマップに統合する</button>
        <button class="btn danger" data-i="replace">今のデータと置き換える</button>
      </div>
      <p class="help" style="margin-top:10px">統合：同じスポットは新しく編集された方を残します。${mine ? `<br>置き換え：今の ${mine}件のスポットは消えます。` : ''}</p>`,
  });
  m.body.addEventListener('click', async (e) => {
    const b = e.target.closest('[data-i]'); if (!b) return;
    const k = b.dataset.i;
    if (k === 'replace' && mine && !(await askConfirm(`今の ${mine}件のスポットを消して、受け取ったデータに置き換えます。よろしいですか？`, { ok: '置き換える', danger: true }))) return;
    m.close();

    const r = mergeData(p.spots, p.trips, k);
    if (source === 'url') applyView(p.view);
    renderAll(); fitAll();

    toast(k === 'replace' ? `置き換えました（スポット ${ns}件）` : `統合しました（追加 ${r.add}件・更新 ${r.upd}件）`, 3600);
  });
}
function enterViewOnly(p) {
  ownBackup = { DB, filters: { ...filters }, layer: settings.layer };
  DB = { spots: {}, trips: {}, tomb: {} };
  for (const s of p.spots) { const n = normalizeSpot(s); DB.spots[n.id] = n; }
  for (const t of p.trips || []) { const n = normalizeTrip(t); DB.trips[n.id] = n; }
  viewOnly = true; $('#viewbar').hidden = false;
  tripView = null;
  if (p.view) applyView(p.view); else fitAll();
  renderAll(); updateSaveStatus();
  setTimeout(() => map.invalidateSize(), 50);
}
function exitViewOnly(action) {
  if (!viewOnly) return;
  const shared = DB;
  viewOnly = false; $('#viewbar').hidden = true;
  if (action === 'replace') {
    for (const id of Object.keys(ownBackup.DB.spots)) if (!shared.spots[id]) shared.tomb[id] = Date.now();
    for (const id of Object.keys(ownBackup.DB.trips)) if (!shared.trips[id]) shared.tomb[id] = Date.now();
    DB = shared;
    for (const id of Object.keys(DB.spots)) Room.queue('spots', id);
    for (const id of Object.keys(DB.trips)) Room.queue('trips', id);
    toast('共有マップで置き換えて保存しました');
  } else {
    DB = ownBackup.DB;
    if (action === 'merge') { const r = mergeData(Object.values(shared.spots), Object.values(shared.trips), 'merge'); toast(`自分のマップに統合しました（追加 ${r.add}件・更新 ${r.upd}件）`, 3600); }
    else { filters = ownBackup.filters; setLayer(ownBackup.layer, true); renderLayerMenu(); toast('自分のマップに戻りました'); }
  }
  ownBackup = null; tripView = null;
  renderAll(); setTimeout(() => map.invalidateSize(), 50);
  if (action !== 'close') { markChanged(); saveNow(false); } else updateSaveStatus();
}
function fitAll() {
  const pts = visibleSpots().map((s) => [s.lat, s.lng]);
  if (pts.length === 1) map.setView(pts[0], 12);
  else if (pts.length) map.fitBounds(L.latLngBounds(pts), { padding: [50, 50], maxZoom: 13 });
}

async function sha256hex(str) {
  try {
    const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
    return Array.from(new Uint8Array(buf)).map((b) => b.toString(16).padStart(2, '0')).join('');
  } catch (e) {
    let h1 = 0xdeadbeef, h2 = 0x41c6ce57, out = '';
    for (let r = 0; r < 4; r++) {
      for (let i = 0; i < str.length; i++) { const c = str.charCodeAt(i) + r; h1 = Math.imul(h1 ^ c, 2654435761); h2 = Math.imul(h2 ^ c, 1597334677); }
      h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);
      h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
      out += (h1 >>> 0).toString(16).padStart(8, '0') + (h2 >>> 0).toString(16).padStart(8, '0');
    }
    return out;
  }
}

  if (!parts.length) { for (const k of Object.keys(root)) delete root[k]; if (data && typeof data === 'object') Object.assign(root, data); return; }
  let node = root;
  for (let i = 0; i < parts.length - 1; i++) { if (!node[parts[i]] || typeof node[parts[i]] !== 'object') node[parts[i]] = {}; node = node[parts[i]]; }
  const last = parts[parts.length - 1];

}

    case 'room-join': roomJoinFromUi(); break;
    case 'room-leave': Room.leave(false); break;
    case 'room-invite': showInvite(); break;
    case 'view-merge': exitViewOnly('merge'); break;
    case 'view-replace': askConfirm('今の自分のデータを、この共有マップで置き換えますか？', { ok: '置き換える', danger: true }).then((ok) => ok && exitViewOnly('replace')); break;
    case 'view-close': exitViewOnly('close'); break;
    case 'pwa-install': PWA.install(); break;
    case 'diag': runDiag(); break;
    case 'off-view': Offline.run(Offline.viewPlan(+($('#pane-share [data-off-depth]') || { value: 2 }).value), '表示範囲'); break;
    case 'off-pins': Offline.run(Offline.pinsPlan('want'), '行きたいピン周辺'); break;
    case 'off-stop': if (Offline.busy) Offline.busy.stop = true; break;
    case 'off-clear': Offline.clear(); break;
    default: break;
  }
}
function bindUi() {
  // 写真URLが読めないときは画像だけ外し、下の絵文字を見せる
  document.addEventListener('error', (e) => {
    const t = e.target; if (!t || t.tagName !== 'IMG' || !t.classList.contains('ph-img')) return;
    const box = t.closest('.pp-photo');
    if (box && !box.querySelector('.pp-nav')) { const body = box.nextElementSibling; box.remove(); if (body) body.classList.add('no-photo'); const pop = box.closest('.leaflet-popup'); if (pop) map.eachLayer((l) => { if (l instanceof L.Popup && l.isOpen()) l.update(); }); }
    else t.remove();
  }, true);
  document.addEventListener('click', (e) => {
    const a = e.target.closest('[data-act]');
    if (a && !a.closest('.leaflet-popup')) onAct(a.dataset.act, a);
    if (!e.target.closest('#searchWrap')) closeSearchDrop();
    if (!e.target.closest('.fabs')) closeLayerMenu();
  });
  // ヘッダー
  $('#btnSave').addEventListener('click', () => saveNow(true));
  $('#btnPanel').addEventListener('click', () => { $('#panel').classList.toggle('closed'); setTimeout(() => map.invalidateSize(), 280); });
  // 検索
  const si = $('#searchInput');
  si.addEventListener('input', debounce(() => renderSearchDrop(si.value), 120));
  si.addEventListener('focus', () => { if (si.value.trim()) renderSearchDrop(si.value); });
  si.addEventListener('keydown', (e) => {
    const btns = $$('#searchDrop .sd-item');
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
      e.preventDefault(); if (!btns.length) return;
      sdActive = (sdActive + (e.key === 'ArrowDown' ? 1 : -1) + btns.length) % btns.length;
      btns.forEach((b, i) => b.classList.toggle('active', i === sdActive)); btns[sdActive].scrollIntoView({ block: 'nearest' });
    } else if (e.key === 'Enter') {
      e.preventDefault();
      if (e.isComposing) return;
      if (sdActive >= 0 && btns[sdActive]) pickSearchItem(btns[sdActive].dataset.i);
      else { const co = parseCoords(si.value); if (co) { const i = sdItems.findIndex((x) => x.type === 'place' && x.lat === co.lat); if (i >= 0) pickSearchItem(i); } else runGeoSearch(si.value); }
    } else if (e.key === 'Escape') { closeSearchDrop(); si.blur(); }
  });
  $('#searchDrop').addEventListener('click', (e) => { const b = e.target.closest('.sd-item'); if (b) pickSearchItem(b.dataset.i); });
  // フィルター
  $('#filters').addEventListener('click', (e) => {
    const st = e.target.closest('[data-status]'); if (st) { filters.status = st.dataset.status; applyFilters(); return; }
    const se = e.target.closest('[data-season]'); if (se) { const k = se.dataset.season; filters.seasons = filters.seasons.includes(k) ? filters.seasons.filter((x) => x !== k) : [...filters.seasons, k]; applyFilters(); return; }
    const ti = e.target.closest('[data-time]'); if (ti) { const k = ti.dataset.time; filters.times = filters.times.includes(k) ? filters.times.filter((x) => x !== k) : [...filters.times, k]; applyFilters(); return; }
    if (e.target.closest('#chipEvent')) { filters.eventOn = !filters.eventOn; applyFilters(); return; }
    if (e.target.closest('#chipGourmet')) { filters.gourmet = !filters.gourmet; applyFilters(); return; }
    if (e.target.closest('#chipReset')) { resetFilters(); }
  });
  $('#eventDate').addEventListener('change', (e) => { filters.eventDate = e.target.value || todayStr(); filters.eventOn = true; applyFilters(); });
  // パネル
  $$('.tabs button').forEach((b) => b.addEventListener('click', () => setTab(b.dataset.tab)));
  $('#sortSel').addEventListener('change', (e) => {
    settings.sort = e.target.value; persistSoon();
    if (settings.sort === 'near' && !myPos) locate(() => renderList()); else renderList();
  });
  const handle = $('#sheetHandle');
  handle.addEventListener('click', () => { const s = $('#panel').dataset.sheet; setSheet(s === 'min' ? 'mid' : s === 'mid' ? 'max' : 'min'); });
  let y0 = null;
  const startDrag = (e) => { y0 = (e.touches ? e.touches[0] : e).clientY; };
  const endDrag = (e) => {
    if (y0 == null) return; const y = (e.changedTouches ? e.changedTouches[0] : e).clientY; const dy = y - y0; y0 = null;
    if (Math.abs(dy) < 30) return;
    const order = ['min', 'mid', 'max']; const i = order.indexOf($('#panel').dataset.sheet);
    setSheet(order[Math.max(0, Math.min(2, i + (dy < 0 ? 1 : -1)))]);
  };
  for (const el of [handle, $('.tabs')]) { el.addEventListener('touchstart', startDrag, { passive: true }); el.addEventListener('touchend', endDrag); }
  // FAB
  $('#btnAdd').addEventListener('click', () => { if (Pick.mode) Pick.end(false); else startAddSpot(); });
  $('#btnLocate').addEventListener('click', () => locate());
  $('#btnLayers').addEventListener('click', (e) => { e.stopPropagation(); const m = $('#layerMenu'); renderLayerMenu(); m.hidden = !m.hidden; });
  $('#layerMenu').addEventListener('click', (e) => {
    const b = e.target.closest('[data-layer]'); if (!b) return; osmFallbackDone = false; setLayer(b.dataset.layer); renderLayerMenu(); closeLayerMenu(); toast(LAYERS[b.dataset.layer].name + 'に切り替えました'); });
  $('#pickCancel').addEventListener('click', () => Pick.end(false));
  $('#pickDone').addEventListener('click', () => Pick.end(false));
  $('#fileImport').addEventListener('change', (e) => { const f = e.target.files && e.target.files[0]; e.target.value = ''; if (f) importFile(f); });
  // 保存のタイミング
  window.addEventListener('beforeunload', () => { if (booted && dirty && !viewOnly) writeLocal(snapshot()); });
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden' && booted && dirty && !viewOnly) { writeLocal(snapshot()); saveNow(false); } });
  window.addEventListener('resize', debounce(() => map.invalidateSize(), 200));
  window.addEventListener('hashchange', handleHash);
  document.addEventListener('change', (e) => { if (e.target.matches('[data-off-depth]')) Offline.updateEstimate(); });
  map && map.on('moveend', () => { if (!$('#pane-share').hidden) Offline.updateEstimate(); });
}
function closeLayerMenu() { $('#layerMenu').hidden = true; }
async function handleHash() {
  const h = location.hash;
  if (h === '#add') { history.replaceState(null, '', baseUrl()); setTimeout(startAddSpot, 400); return; }
  if (h.startsWith('#share=')) {
    history.replaceState(null, '', baseUrl());
    try { const p = await unpackData(h); if (!validPayload(p)) throw new Error('bad'); openImportDialog(p, 'url'); }
    catch (e) { toast('共有URLを読み取れませんでした（URLが途中で切れている可能性があります）', 5000); }
  } else if (h.startsWith('#room=')) {
    history.replaceState(null, '', baseUrl());
    try {
      const o = JSON.parse(new TextDecoder().decode(bytesFromB64url(h.slice(6))));
      if (await askConfirm('合言葉の同期ルームに招待されています。参加しますか？\n（参加すると、あなたのスポットもルームに共有されます）', { ok: '参加する' })) {
        await Room.join(o.u, o.p); setTab('share'); renderSharePane();
      }
    } catch (e) { toast(e.message || '招待リンクを読み取れませんでした', 5000); }
  }
}

/* ---------- 起動 ---------- */
async function boot() {
  initMap();
  bindUi();
  PWA.init();
  if (isMobile()) $('#searchInput').placeholder = '場所を検索';
  const clock = () => { $('#clock').textContent = hms(); };
  clock(); setInterval(clock, 1000);
  renderFilterChips();
  renderSharePane();
  let had = false;
  try { had = await loadState(); } catch (e) { console.warn(e); }
  booted = true;
  if (!LAYERS[settings.layer]) settings.layer = 'gsi_std';
  setLayer(settings.layer, true);
  if (settings.view && settings.view.c) map.setView(settings.view.c, settings.view.z || 10);
  else if (spotsArr().length) fitAll();
  renderFilterChips(); renderSharePane(); renderAll(); updateSaveStatus();
  if (!had && !spotsArr().length) setTimeout(() => { if (!viewOnly && !spotsArr().length) toast('地図をタップするか ＋ ボタンで、行きたい場所を登録できます', 4500); }, 900);
  await handleHash();
  if (settings.roomOn && settings.fbUrl && settings.roomPass && !viewOnly) {
    Room.join(settings.fbUrl, settings.roomPass, { silent: true }).catch((e) => { Room.setStatus('err', '再接続できませんでした'); toast('同期ルームに再接続できませんでした：' + e.message, 5000); });
  }
}
boot();

</script>
